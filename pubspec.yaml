publish_to: 'none' 
version: 1.0.1+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  easy_localization: ^3.0.8
  dio: ^5.9.0
  flutter_screenutil: ^5.9.3
